version: '3.8'

services:
  facefusion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: facefusion
    ports:
      - "7860:7860"
    volumes:
      # Mount output directory for generated files
      - ./outputs:/app/outputs
      # Mount temp directory
      - ./temp:/app/temp
      # Optional: mount input files directory
      - ./input:/app/input
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=1
    # Uncomment below if you have NVIDIA GPU and want to use it
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # runtime: nvidia
    restart: unless-stopped
    # Keep container running
    stdin_open: true
    tty: true
